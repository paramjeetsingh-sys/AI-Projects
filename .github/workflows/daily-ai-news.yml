name: Daily AI News Digest

on:
  schedule:
    # Runs at 7:00 AM UTC daily (12:30 PM IST)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file written)'
        required: false
        default: 'false'
        type: boolean
      lookback_hours:
        description: 'Hours of news to fetch (default: 24)'
        required: false
        default: '24'
        type: string
      no_email:
        description: 'Skip email even if credentials are configured'
        required: false
        default: 'false'
        type: boolean

jobs:
  ai-digest:
    name: Fetch & Store AI News Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-news-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-news-aggregator/requirements.txt

      - name: Run AI News Digest
        id: digest
        working-directory: ai-news-aggregator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            ARGS="$ARGS --lookback-hours ${{ github.event.inputs.lookback_hours }}"
          fi
          if [ "${{ github.event.inputs.no_email }}" = "true" ]; then
            ARGS="$ARGS --no-email"
          fi
          python main.py $ARGS 2>&1 | tee /tmp/digest_output.txt
          echo "email_sent=$(grep -c '\[EMAIL\] Digest sent' /tmp/digest_output.txt || echo 0)" >> $GITHUB_OUTPUT
          echo "email_to=${{ secrets.EMAIL_TO }}" >> $GITHUB_OUTPUT

      - name: Write job summary
        if: always()
        run: |
          EMAIL_TO="${{ secrets.EMAIL_TO }}"
          if grep -q '\[EMAIL\] Digest sent' /tmp/digest_output.txt 2>/dev/null; then
            STATUS="✅ Email sent to \`${EMAIL_TO}\`"
          elif grep -q '\[EMAIL\] Skipped' /tmp/digest_output.txt 2>/dev/null; then
            STATUS="⚠️ Email skipped — secrets not configured"
          else
            STATUS="ℹ️ Email not attempted (dry-run or --no-email)"
          fi

          echo "## AI Daily Digest — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Email:** ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -z "${EMAIL_TO}" ]; then
            echo "### Setup required to receive emails" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Go to **Settings → Secrets and variables → Actions → New repository secret** and add:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Secret | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| \`GROQ_API_KEY\` | Your Groq API key (free at console.groq.com) |" >> $GITHUB_STEP_SUMMARY
            echo "| \`EMAIL_FROM\` | Your Gmail address |" >> $GITHUB_STEP_SUMMARY
            echo "| \`EMAIL_PASSWORD\` | Gmail App Password (myaccount.google.com/apppasswords) |" >> $GITHUB_STEP_SUMMARY
            echo "| \`EMAIL_TO\` | Recipient email(s), comma-separated |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Full output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/digest_output.txt 2>/dev/null || echo "(no output)"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Commit daily digest to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit (dry-run or already up to date)."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
