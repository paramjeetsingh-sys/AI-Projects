name: Daily AI News Digest

on:
  schedule:
    # Runs at 7:00 AM UTC daily (12:30 PM IST)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email sent)'
        required: false
        default: 'false'
        type: boolean
      lookback_hours:
        description: 'Hours of news to fetch (default: 24)'
        required: false
        default: '24'
        type: string

jobs:
  send-ai-digest:
    name: Fetch & Email AI News Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to commit the daily digest file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-news-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-news-aggregator/requirements.txt

      - name: Run AI News Digest
        working-directory: ai-news-aggregator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: paramjeet.singh@classplus.co
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            ARGS="$ARGS --lookback-hours ${{ github.event.inputs.lookback_hours }}"
          fi
          python main.py $ARGS

      - name: Commit daily digest to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit (dry-run or already up to date)."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-digest-${{ github.run_id }}
          path: digests/
          retention-days: 30
