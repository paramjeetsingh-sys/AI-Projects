name: Daily AI News Digest

on:
  schedule:
    # Runs at 7:00 AM UTC daily (12:30 PM IST)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file written, no email sent)'
        required: false
        default: 'false'
        type: boolean
      lookback_hours:
        description: 'Hours of news to fetch (default: 24)'
        required: false
        default: '24'
        type: string

jobs:
  ai-digest:
    name: Fetch, Summarize & Email AI News Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-news-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-news-aggregator/requirements.txt

      - name: Run AI News Digest
        working-directory: ai-news-aggregator
        env:
          # ── Summarization ─────────────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # ── Email (Gmail SMTP) ─────────────────────────────────────────
          # EMAIL_FROM     → Gmail address used to send (e.g. you@gmail.com)
          # EMAIL_PASSWORD → Gmail App Password (not your login password!)
          #                  Create one at: https://myaccount.google.com/apppasswords
          # EMAIL_TO       → Recipient(s), comma-separated
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       bishambarsingh333@gmail.com
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run --no-email"
          fi
          if [ -n "${{ github.event.inputs.lookback_hours }}" ]; then
            ARGS="$ARGS --lookback-hours ${{ github.event.inputs.lookback_hours }}"
          fi
          python main.py $ARGS

      - name: Commit daily digest to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit (dry-run or already up to date)."
          else
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
