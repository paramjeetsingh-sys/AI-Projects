name: Daily AI News Digest

on:
  schedule:
    # Runs every day at 07:00 AM UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of news to look back (default: 24)"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-news-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-news-aggregator/requirements.txt

      - name: Run AI News Digest
        working-directory: ai-news-aggregator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          HOURS="${{ github.event.inputs.lookback_hours || '24' }}"
          python main.py --lookback-hours "$HOURS"

      - name: Commit digest file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest file to commit."
          else
            git commit -m "chore: add AI digest for $(date +%Y-%m-%d)"
            git push origin HEAD
          fi
